
<!DOCTYPE html>
<html>
<head>
    <title>Letter</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;

            /* PAGE BACKGROUND */
            background-image:
                linear-gradient(
                    rgba(255, 221, 225, 0.40),
                    rgba(238, 156, 167, 0.40)
                ),
                url("Gemini_Generated_Image_v4hyvwv4hyvwv4hy.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            margin: 0;
            overflow-x: hidden;
        }

        nav {
            background: rgba(255, 77, 136, 0.9);
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }

        nav a:hover {
            color: yellow;
        }

        .container {
            margin-top: 40px;
            padding: 10px;
        }

        h2 {
            color: white;
            text-shadow: 2px 2px 5px #ff4d88;
        }

        /* AUDIO */
        .audio-box {
            margin-top: 10px;
        }

        audio {
            width: 90%;
            max-width: 300px;
        }

        /* LETTER BOX */
        .letter-box {
            background-image: url("WhatsApp%20Image%202026-11-27%20at%201.52.58%20PM.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);

            text-align: left;
            font-size: 16px;
            line-height: 1.8;
            font-weight: bold;
            color: black;

            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        /* LETTER TEXT */
        #text {
            color: black;
            font-weight: bold;
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background: black;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* NEXT PAGE BUTTON */
        .next-btn {
            display: inline-block;
            margin: 25px auto 40px;
            padding: 13px 35px;
            background: #ff4d88;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .next-btn:hover {
            background: #ff1a66;
            transform: scale(1.1);
        }

        /* MOBILE */
        @media (max-width: 600px) {
            h2 {
                font-size: 20px;
            }

            .letter-box {
                font-size: 14px;
                padding: 15px;
            }

            nav a {
                margin: 5px;
                font-size: 13px;
            }

            body {
                background-attachment: scroll;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>💌 A Special Letter</h2>

    <!-- AUDIO -->
    <div class="audio-box">

        <p style="color:white;">
            🎵 A special song for you pandhi💕
        </p>

        <audio controls autoplay loop>
            <source src="WhatsApp Ptt 2026-11-27 at 1.06.21 PM.ogg" type="audio/ogg">
        </audio>

    </div>

    <!-- LETTER -->
    <div class="letter-box">
        <span id="text"></span><span class="cursor"></span>
    </div>

    <!-- NEXT PAGE BUTTON -->
    <a href="gift.html" class="next-btn">
        Next Page 💖
    </a>

</div>

<script>

const message = `Happy Birthday ❤️
Hii Akkaaaa! 🥰❤️Wishing you many more happy returns of the day! 🎂🎉💗. Today, I am writing this letter to tell you something that has been in my heart for a long time. I really miss those days before your marriage. 🥺❤️ Those days when we used to fight, tease each other, scold each other, and sometimes even cry. 😂😭 Honestly, those were the best days of my life! 🫶🏻✨After your marriage, everything changed. I don't know how to explain my feelings, but sometimes I feel like I went from being your best friend to becoming a stranger. Before your marriage, whatever happened in my life, you were always the first person I shared it with. But now, even when I have something to tell you, I can't share everything with you like before. Maybe it's because of my anger, or maybe things have changed. 🥺And I am really sorry for that. 🙏🏻❤️ I realise that I have hurt you a lot sometimes, and I never wanted to make you feel bad.But today, I want to promise you one thing: I want us to be best friends forever, just like we were before your marriage. 🫂💕 No matter how much life changes, I never want our bond to change. ♾️❤️I miss our silly fights, our little secrets, our laughter, and every small moment we shared. 🥹💗 I miss those days so much!I love you sooooo much, Akka! ❤️ Please take care of your health and always keep smiling. 🌸🫶🏻 I wish you a beautiful future filled with happiness, love, and blessings. And I hope one day you will become the mother of a beautiful little princess. 👶🏻🎀💖Once again, happiest birthday, Akkaaaa! 🎂🎊No matter what happens, you will always be my Akka and my best friend. Love you forever and ever! ❤️🫂♾️
YAPUDU ME AYANEY KADHUAMMA NE KUDA PUTINA VALLANI KUDA PATINCHUKONDI 🤭🎀`;

let i = 0;

function typeEffect() {

    if (i < message.length) {

        document.getElementById("text").textContent += message.charAt(i);

        i++;

        setTimeout(typeEffect, 35);
    }

}

typeEffect();

</script>

</body>
</html>
